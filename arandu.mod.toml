# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these four lines with what the code calls.

name = "hyz-is/bodycomp"
# This package imports no framework package and no module at all: it is the
# standard library alone. The floor names the Framework release the
# applications that install it are built on.
framework = ">= 0.71"
profiles = ["conventional", "performance"]

[permissions]
# It turns numbers and text into numbers and text. Nothing leaves the process.
network = false
# It reads no file and writes none; every value arrives as an argument.
filesystem = false
# It runs no other program.
exec = false
# It owns no table: a measurement, an estimate and a session are stored by the
# application that took them.
migrations = false
